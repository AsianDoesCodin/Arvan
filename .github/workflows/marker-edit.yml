name: Validate paired quest marker edit
on:
  push:
    branches: ['chatgpt/paired-quest-markers']
permissions:
  contents: write
jobs:
  marker-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply exact-source edit, test, and publish Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['REPOSITORY']
          assert repo == 'AsianDoesCodin/Arvan'
          def api(endpoint, value=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + endpoint,
                  data=None if value is None else json.dumps(value).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'Arvan-marker-tests'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def read_path(path):
              result = api('/contents/' + path + '?ref=' + os.environ['SOURCE_REF'])
              return base64.b64decode(result['content'])
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for path in ['.marker-build/build_manifest.py', 'scripts/tests/quest-map.test.cjs']:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(read_path(path))
          subprocess.run(['python3', '.marker-build/build_manifest.py'], check=True)
          manifest = json.loads(Path('.marker-build/changes.json').read_text())
          changed = []
          for item in manifest['files']:
              original = base64.b64decode(api('/git/blobs/' + item['sha'])['content'])
              assert blob_sha(original) == item['sha'], 'Original blob mismatch'
              original_text = original.decode('utf-8', errors='surrogateescape')
              text = original_text
              for change in item['edits']:
                  if item['path'] == 'scripts/quest_map.html' and change['old'] == 'markerId: element("markerId").value }':
                      change['scope'] = ['function send(action, data, message) {', '\nfunction saveMarker(']
                  lo, hi = 0, len(text)
                  if 'scope' in change:
                      lo = text.index(change['scope'][0])
                      hi = text.index(change['scope'][1], lo)
                  pattern = re.escape(change['old']).replace('\\\n', '\\r?\\n')
                  matches = list(re.finditer(pattern, text[lo:hi]))
                  assert len(matches) == 1, (item['path'], change['old'][:70], len(matches))
                  match = matches[0]
                  start, end = lo + match.start(), lo + match.end()
                  before = text[start:end]
                  newline = '\r\n' if '\r\n' in before else '\n'
                  replacement = change['new'].replace('\n', newline)
                  text = text[:start] + replacement + text[end:]
              output = text.encode('utf-8', errors='surrogateescape')
              target = Path(item['path'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(output)
              for bad in ['\ufffd', 'Â§', 'Ã', 'â']:
                  assert text.count(bad) <= original_text.count(bad), 'New encoding corruption'
              assert [c for c in text if '\udc80' <= c <= '\udcff'] == [c for c in original_text if '\udc80' <= c <= '\udcff'], 'Unrelated legacy bytes changed'
              changed.append(item['path'])
          subprocess.run(['node', '--check', 'scripts/player/ADMsLevelingSystem.js'], check=True)
          subprocess.run(['node', '--test', 'scripts/tests/quest-map.test.cjs'], check=True)
          changed.append('scripts/tests/quest-map.test.cjs')
          for path in changed:
              data = Path(path).read_bytes()
              result = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              assert result['sha'] == blob_sha(data)
              print('VALIDATED_BLOB ' + path + ' ' + result['sha'], flush=True)
          print('NO_BRANCH_OR_LIVE_SERVER_CHANGES_PERFORMED', flush=True)
          PY

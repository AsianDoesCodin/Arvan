*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font:18px/1.55 Georgia,'Times New Roman',serif;user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,#100c0933,#06050583);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid #f5d391;outline-offset:3px}
button:disabled{cursor:default}
[hidden]{display:none!important}
.conversation{position:relative;isolation:isolate;width:min(1040px,92vw);height:min(680px,88vh);background:#12110f var(--dialog-art) center/100% 100% no-repeat;box-shadow:0 24px 65px #000b;animation:enter .22s ease-out}
.conversation:focus{outline:none}
.portrait{position:absolute;left:5.5%;right:70.5%;top:23%;bottom:17%;pointer-events:none}
.entity-slot{width:100%;height:100%}
.portrait-caption{position:absolute;left:5.5%;right:70.5%;bottom:9.5%;text-align:center;color:#d6b47d;font:10px/1.35 'Segoe UI',Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 4px #000}
.content{position:absolute;left:36.5%;right:5.5%;top:7%;bottom:7%;display:flex;flex-direction:column;min-width:0;min-height:0}
.header{display:flex;align-items:flex-start;gap:16px;padding-bottom:19px;border-bottom:1px solid #8d694f66;flex:none}
.identity{flex:1;min-width:0}
.eyebrow{margin:0 0 5px;color:#bd9862;font:10px/1.4 'Segoe UI',Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}
h1{margin:0;color:var(--gold);font-size:31px;font-weight:normal;line-height:1.15;overflow-wrap:anywhere;text-shadow:0 2px 4px #000}
.leave{flex:none;border:1px solid #936d43;background:linear-gradient(#532e25,#2c1a17);padding:7px 14px;font-size:14px;line-height:1.5;min-height:38px;margin-top:3px}
.leave:hover{background:linear-gradient(#744134,#43231c);border-color:#dbad71}
.speech{flex:1;min-height:48px;overflow-y:auto;padding:22px 10px 18px 0;scrollbar-gutter:stable;cursor:default}
.dialogue-text{overflow-wrap:anywhere;white-space:normal;text-shadow:0 1px 3px #000;line-height:1.65}
.dialogue-text.typing::after{content:'';display:inline-block;width:2px;height:16px;margin-left:4px;background:#d4b078;vertical-align:baseline;animation:blink .7s step-end infinite}
.quest{flex:none;display:flex;align-items:baseline;gap:10px;padding:9px 12px;margin:0 0 13px;border-left:2px solid #bc9553;background:#b08b3712;font:13px/1.4 'Segoe UI',Arial,sans-serif;overflow-wrap:anywhere}
.quest-tag{flex:none;color:#d4b279;font-size:9px;letter-spacing:1.5px;text-transform:uppercase}
.responses{flex:0 1 auto;display:flex;flex-direction:column;min-height:65px;max-height:50%}
.response-heading{display:flex;align-items:center;gap:14px;margin:0 0 10px;color:#bd9862;font:10px/1.3 'Segoe UI',Arial,sans-serif;letter-spacing:1.7px;text-transform:uppercase;flex:none}
.response-heading::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,#8d694f66,transparent)}
.options{display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:0;padding:3px 6px 3px 3px;margin:-3px -6px -3px -3px;scrollbar-gutter:stable}
.options.concealed{visibility:hidden}
.option-btn{display:flex;align-items:baseline;gap:12px;width:100%;min-height:45px;flex-shrink:0;padding:10px 14px;text-align:left;border:1px solid #86643f77;border-radius:0;background:linear-gradient(100deg,#462d226e,#2a211ca3);font-size:16px;line-height:1.4;transition:background .12s,border-color .12s,color .12s}
.option-btn:not(:disabled):hover{background:linear-gradient(100deg,#743c29bd,#3b291ebd);border-color:#cea16a;color:#ffe4b6}
.option-btn:disabled{color:#8b7f6d;border-color:#67583c44;background:#211d1866}
.option-number{flex:none;color:#c29d65;font:11px/1.5 'Segoe UI',Arial,sans-serif;min-width:15px;align-self:center;text-align:center;border-right:1px solid #98754766;padding-right:10px}
.option-label{min-width:0;overflow-wrap:anywhere}
.option-btn:disabled .option-number{color:#8b7f6d}
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:39px;padding-top:15px;flex:none;color:var(--muted);font:11px/1.35 'Segoe UI',Arial,sans-serif}
.hint{display:flex;flex-wrap:wrap;gap:5px 15px}
kbd{font:10px 'Segoe UI',Arial,sans-serif;color:#d8c39d;border:1px solid #8b704d88;padding:1px 4px;margin-right:4px}
.reveal{padding:3px 0;border:0;border-bottom:1px solid #a3805188;background:none;color:var(--gold);font:12px/1.4 'Segoe UI',Arial,sans-serif;white-space:nowrap}
.reveal:hover{color:#ffe4b6;border-color:#ffe4b6}
.status{margin-left:auto;color:#c5ad83;font-size:12px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0003}
::-webkit-scrollbar-thumb{background:#84603d}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@media(max-width:800px){body{font-size:16px}.content{left:36%;right:5%;top:7%;bottom:7%}.header{padding-bottom:13px;gap:10px}h1{font-size:26px}.speech{padding-top:16px}.option-btn{font-size:14px;padding:9px 11px}.footer{gap:6px}.hint{gap:5px 9px}.leave{padding:6px 10px;font-size:13px}}
@media(max-width:620px),(max-width:800px) and (max-height:520px){.conversation{width:94vw;height:92vh;background-size:154% 100%;background-position:right center;border-left:1px solid #b18a55}.portrait{width:0;height:0;overflow:hidden}.portrait-caption{display:none}.content{left:7%;right:7%;top:7%;bottom:7%}h1{font-size:26px}.responses{max-height:48%}}
@media(max-height:520px){body{font-size:15px}.conversation{height:94vh}.content{top:6%;bottom:6%}.header{padding-bottom:9px}h1{font-size:24px}.eyebrow{font-size:9px;margin-bottom:3px}.speech{padding:10px 7px 10px 0}.quest{padding:6px 9px;margin-bottom:8px;font-size:12px}.responses{max-height:40%}.option-btn{min-height:35px;padding:6px 10px;font-size:14px}.options{gap:5px}.response-heading{margin-bottom:7px;font-size:9px}.footer{padding-top:9px;min-height:31px}.portrait-caption{font-size:9px}.leave{padding:5px 10px;min-height:32px}}
@media(prefers-reduced-motion:reduce){.conversation,.dialogue-text.typing::after{animation:none}.option-btn{transition:none}}
@media(max-height:400px){.eyebrow{display:none}h1{font-size:20px}.header{padding-bottom:7px;min-height:40px}.speech{min-height:70px;padding-top:8px;padding-bottom:8px}.quest{padding:5px 9px}.responses{max-height:36%}.footer{padding-top:7px;min-height:28px}}
</style>
</head>
<body>
<main class="conversation" id="conversation" role="dialog" aria-modal="true" aria-labelledby="npcName" tabindex="-1">
  <div class="portrait" id="npcEntity" aria-hidden="true"><div class="entity-slot" data-mc-entity="0"></div></div>
  <div class="portrait-caption" aria-hidden="true">In conversation</div>
  <div class="content">
    <header class="header">
      <div class="identity"><p class="eyebrow">Conversation</p><h1 id="npcName">NPC</h1></div>
      <button class="leave" id="closeButton" type="button" aria-label="Leave conversation">Leave</button>
    </header>
    <div class="speech" id="speech" tabindex="0" aria-label="Dialogue text"><div class="dialogue-text" id="dialogueText"></div></div>
    <div class="quest" id="quest" hidden><span class="quest-tag">Quest</span><span id="questTitle"></span></div>
    <section class="responses" aria-labelledby="responseHeading">
      <h2 class="response-heading" id="responseHeading">Your response</h2>
      <div class="options concealed" id="options" aria-hidden="true"></div>
    </section>
    <footer class="footer">
      <div class="hint"><span id="choiceHint"><kbd>1–9</kbd>Choose</span><span><kbd>Esc</kbd>Leave</span></div>
      <button class="reveal" id="skipButton" type="button"><kbd>Space</kbd>Reveal text</button>
      <span class="status" id="status" role="status" hidden>Listening…</span>
    </footer>
  </div>
</main>
<script>
var initial = window.cnpc.initData || {}
var npcName = initial.npcName || 'NPC'
var currentDialog = null
var typeTimer = null
var typeComplete = false
var fullText = ''
var visibleCount = 0
var textLength = 0
var actionPending = false
var closed = false
var optionButtons = []
var optionsEl = document.getElementById('options')
var dialogueEl = document.getElementById('dialogueText')
var skipEl = document.getElementById('skipButton')
var statusEl = document.getElementById('status')
var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
var colors = {'0':'#000000','1':'#0000aa','2':'#00aa00','3':'#00aaaa','4':'#aa0000','5':'#aa00aa','6':'#ffaa00','7':'#aaaaaa','8':'#555555','9':'#5555ff','a':'#55ff55','b':'#55ffff','c':'#ff5555','d':'#ff55ff','e':'#ffff55','f':'#ffffff'}

function escapeHtml(value) {
  return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

function plainText(value) {
  return String(value == null ? '' : value).replace(/\u00a7./g,'')
}

function mcColorToHtml(value, limit) {
  var text = String(value == null ? '' : value)
  var result = ''
  var style = ''
  var underline = false
  var strike = false
  var spanOpen = false
  var count = 0
  for (var i = 0; i < text.length; i++) {
    if (text.charAt(i) === '\u00a7' && i + 1 < text.length) {
      var code = text.charAt(++i).toLowerCase()
      if (colors[code]) { style = 'color:' + colors[code] + ';'; underline = false; strike = false }
      else if (code === 'r') { style = ''; underline = false; strike = false }
      else if (code === 'l') style += 'font-weight:bold;'
      else if (code === 'o') style += 'font-style:italic;'
      else if (code === 'n') underline = true
      else if (code === 'm') strike = true
      else continue
      if (spanOpen) result += '</span>'
      spanOpen = false
      continue
    }
    if (limit != null && count >= limit) break
    if (!spanOpen && (style || underline || strike)) {
      var decoration = underline || strike ? 'text-decoration:' + (underline ? 'underline ' : '') + (strike ? 'line-through' : '') + ';' : ''
      result += '<span style="' + style + decoration + '">'
      spanOpen = true
    }
    var character = text.charAt(i)
    var codePoint = text.charCodeAt(i)
    if (codePoint >= 0xd800 && codePoint <= 0xdbff && i + 1 < text.length) {
      var next = text.charCodeAt(i + 1)
      if (next >= 0xdc00 && next <= 0xdfff) character += text.charAt(++i)
    }
    result += character === '\n' ? '<br>' : escapeHtml(character)
    count++
  }
  if (spanOpen) result += '</span>'
  return result
}

function visibleLength(value) {
  var text = plainText(value)
  var count = 0
  for (var i = 0; i < text.length; i++) {
    var code = text.charCodeAt(i)
    if (code >= 0xd800 && code <= 0xdbff && i + 1 < text.length && text.charCodeAt(i + 1) >= 0xdc00 && text.charCodeAt(i + 1) <= 0xdfff) i++
    count++
  }
  return count
}

function showOptions() {
  optionsEl.classList.remove('concealed')
  optionsEl.setAttribute('aria-hidden','false')
  skipEl.hidden = true
  for (var i = 0; i < optionButtons.length; i++) optionButtons[i].button.disabled = optionButtons[i].unavailable || actionPending
}

function skipTypewriter() {
  if (typeComplete || closed) return
  var moveFocus = document.activeElement === skipEl
  clearTimeout(typeTimer)
  dialogueEl.innerHTML = mcColorToHtml(fullText)
  dialogueEl.classList.remove('typing')
  typeComplete = true
  showOptions()
  if (moveFocus) {
    var focusTarget = document.getElementById('closeButton')
    for (var i = 0; i < optionButtons.length; i++) {
      if (!optionButtons[i].button.disabled) { focusTarget = optionButtons[i].button; break }
    }
    focusTarget.focus()
  }
}

function typeTick() {
  if (closed || typeComplete) return
  visibleCount++
  dialogueEl.innerHTML = mcColorToHtml(fullText,visibleCount)
  if (visibleCount >= textLength) { skipTypewriter(); return }
  typeTimer = setTimeout(typeTick,25)
}

function closeConversation(eventName, payload) {
  if (closed) return
  closed = true
  clearTimeout(typeTimer)
  window.cnpc.sendEvent(eventName || 'close',payload || {})
  window.cnpc.close()
}

function chooseOption(option) {
  if (closed || !typeComplete || actionPending || option.disabled || option.type === 2) return
  if (option.type === 1 && option.hasDialog && option.dialogId >= 0) {
    actionPending = true
    statusEl.hidden = false
    optionsEl.setAttribute('aria-busy','true')
    showOptions()
    window.cnpc.sendEvent('navigate',{dialogId:option.dialogId})
    return
  }
  if (option.type === 3) { closeConversation('openRole',{}); return }
  if (option.type === 4) { closeConversation('runCommand',{command:option.title}); return }
  closeConversation()
}

function addOption(option, index) {
  var button = document.createElement('button')
  button.className = 'option-btn'
  button.type = 'button'
  var number = document.createElement('span')
  number.className = 'option-number'
  number.setAttribute('aria-hidden','true')
  number.textContent = index < 9 ? String(index + 1) : '›'
  var label = document.createElement('span')
  label.className = 'option-label'
  label.innerHTML = mcColorToHtml(option.title)
  button.appendChild(number)
  button.appendChild(label)
  var unavailable = !!option.disabled || option.type === 2
  button.disabled = true
  if (unavailable) button.setAttribute('aria-label',plainText(option.title) + ' (unavailable)')
  button.onclick = function() { chooseOption(option) }
  optionsEl.appendChild(button)
  optionButtons.push({button:button,option:option,unavailable:unavailable})
}

function renderDialog(dialog) {
  if (!dialog || closed) return
  clearTimeout(typeTimer)
  currentDialog = dialog
  typeComplete = false
  actionPending = false
  statusEl.hidden = true
  optionsEl.setAttribute('aria-busy','false')
  optionsEl.setAttribute('aria-hidden','true')
  optionsEl.classList.add('concealed')
  optionsEl.innerHTML = ''
  optionsEl.scrollTop = 0
  optionButtons = []
  document.getElementById('npcName').textContent = plainText(dialog.npcName || npcName)
  var hasQuest = dialog.questId >= 0 && !!dialog.questTitle
  document.getElementById('quest').hidden = !hasQuest
  document.getElementById('questTitle').textContent = plainText(dialog.questTitle)
  var choices = dialog.options || []
  for (var i = 0; i < choices.length; i++) addOption(choices[i],i)
  if (!choices.length) addOption({title:'Farewell.',type:0},0)
  document.getElementById('choiceHint').hidden = optionButtons.length === 0
  fullText = String(dialog.text == null ? '' : dialog.text)
  visibleCount = 0
  textLength = visibleLength(fullText)
  dialogueEl.innerHTML = ''
  dialogueEl.classList.add('typing')
  document.getElementById('speech').scrollTop = 0
  skipEl.hidden = false
  if (reduceMotion || !textLength) skipTypewriter()
  else typeTick()
}

document.getElementById('closeButton').onclick = function() { closeConversation() }
skipEl.onclick = skipTypewriter
dialogueEl.addEventListener('click',skipTypewriter)
window.cnpc.onEvent('showDialog',function(data) {
  try {
    if (typeof data === 'string') data = JSON.parse(data)
    if (typeof data === 'string') data = JSON.parse(data)
  } catch (error) { return }
  if (data && data.dialog) renderDialog(data.dialog)
})
document.addEventListener('keydown',function(event) {
  if (event.key === 'Escape') { event.preventDefault(); closeConversation(); return }
  if (event.key === 'Tab') {
    var focusable = [document.getElementById('closeButton'),document.getElementById('speech')]
    for (var i = 0; i < optionButtons.length; i++) if (!optionButtons[i].button.disabled) focusable.push(optionButtons[i].button)
    if (!skipEl.hidden) focusable.push(skipEl)
    var first = focusable[0]
    var last = focusable[focusable.length - 1]
    if (event.shiftKey && (document.activeElement === first || document.activeElement === document.getElementById('conversation'))) { event.preventDefault(); last.focus() }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus() }
    return
  }
  if (event.altKey || event.ctrlKey || event.metaKey || event.repeat) return
  if (!typeComplete && (event.key === ' ' || event.key === 'Spacebar')) { event.preventDefault(); skipTypewriter(); return }
  if (typeComplete && /^[1-9]$/.test(event.key)) {
    var entry = optionButtons[Number(event.key) - 1]
    if (entry) { event.preventDefault(); chooseOption(entry.option) }
  }
})
renderDialog(initial.dialog || {text:'',npcName:npcName,options:[]})
document.getElementById('conversation').focus()
</script>
</body>
</html>

function sameDimension(marker){var player=state.player||{},markerName=String(marker.dimensionName||""),playerName=String(player.dimensionName||""),markerId=Number(marker.dimension),playerId=Number(player.dimension);if(markerName&&playerName)return markerName===playerName;if(!isNaN(markerId)&&!isNaN(playerId))return markerId===playerId;return true}

<title>Character</title>
<style>
* { box-sizing: border-box }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden }
body { background: transparent; color: #eadbc1; font: 15px/1.5 Georgia, serif; user-select: none; display: grid; place-items: center }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid #82603c; background: #191919; padding: 8px 18px }
button:hover:not(:disabled), button:focus-visible { border-color: #e0b875; background: #38271e; color: #fff0d4; outline: 2px solid #c59353; outline-offset: 2px }
button:disabled { opacity: .45; cursor: default }
[hidden] { display: none !important }
#menu { position: relative; width: min(96vw, 138vh); height: min(64vw, 92vh); overflow: hidden; background: transparent var(--rpg-art) center / 100% 100% no-repeat; clip-path: polygon(4.2% 0, 9% 0, 10% 3%, 43% 3%, 44% 0, 56% 0, 57% 3%, 90% 3%, 91% 0, 95.8% 0, 100% 7%, 99.2% 92%, 95.5% 100%, 4.5% 100%, .8% 92%, 0 7%) }
#identity { position: absolute; left: 6.5%; top: 10%; width: 24%; overflow-wrap: anywhere }
h1 { font-weight: normal; font-size: clamp(20px, 2.4vw, 36px); line-height: 1.2; margin: 0 0 6px }
.muted { color: #c0af98; font: 13px/1.5 'Segoe UI', sans-serif }
#available { margin-top: 18px; padding-top: 14px; border-top: 1px solid #715535 }
#available strong { color: #a7cfaa }
#navigation { position: absolute; left: 6%; top: 32%; width: 23%; bottom: 17%; display: grid; gap: 12px }
.navButton { display: flex; align-items: center; gap: 14px; border: 1px solid #9f7541; background: linear-gradient(90deg,rgba(24,18,15,.92),rgba(73,39,27,.85),rgba(24,18,15,.92)); box-shadow: inset 0 0 0 2px rgba(38,24,17,.8), 0 3px 8px #0008; text-align: left; padding: 7px 16px 7px 10px; font-size: clamp(17px, 1.9vw, 28px); clip-path: polygon(11px 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,11px 100%,0 50%) }
.navButton:hover:not(:disabled), .navButton:focus-visible { background: linear-gradient(90deg,#4e211d,#7c3027,#4e211d); border-color: #e1b267 }
.navButton img { width: clamp(30px, 3.8vw, 58px); height: clamp(30px, 3.8vw, 58px); flex: 0 0 auto; padding: 5px; border: 1px solid #c29452; border-radius: 50%; background: radial-gradient(circle,#4c3324,#191613 67%); opacity: .95; filter: sepia(.7) }
#portrait { position: absolute; left: 39%; top: 25%; width: 22%; height: 43%; pointer-events: none }
#portrait[hidden], #menu.confirming #portrait { width: 0; height: 0 }
#progress { position: absolute; left: 34%; top: 75%; width: 32%; padding: 7px 13px 8px; border: 1px solid #a77a42; border-radius: 18px; background: linear-gradient(180deg,rgba(37,25,18,.9),rgba(16,19,17,.9)); box-shadow: inset 0 0 0 2px rgba(11,12,11,.7),0 3px 10px #0008; text-align: center }
#level { color: #ffe0a3; font-size: clamp(27px, 3.2vw, 44px); line-height: 1 }
.eyebrow { color: #c99d62; font: 12px/1.4 'Segoe UI', sans-serif; letter-spacing: .12em; text-transform: uppercase }
progress { width: 100%; height: 14px; overflow: hidden; accent-color: #d2a251; border: 1px solid #d5a65b; border-radius: 999px; margin: 8px 0 3px; background: #111310; box-shadow: inset 0 1px 3px #000 }
progress::-webkit-progress-bar { border-radius: 999px; background: #111310 }
progress::-webkit-progress-value { border-radius: 999px; background: linear-gradient(90deg,#8f5724,#e2b65e,#bd7b32) }
progress::-moz-progress-bar { border-radius: 999px; background: linear-gradient(90deg,#8f5724,#e2b65e,#bd7b32) }
#xpText { color: #ead7b1; font-weight: 600; text-shadow: 0 1px #000 }
#questFeature { position: absolute; left: 72%; top: 29%; width: 21%; bottom: 19%; display: flex; flex-direction: column }
#questFeature > img { width: 65px; height: 65px; margin-bottom: 24px; opacity: .75; filter: sepia(.7) }
#questTitle { font-size: clamp(20px, 2.3vw, 32px); line-height: 1.25; font-weight: normal; margin: 12px 0 20px; overflow-wrap: anywhere }
#questSummary { min-height: 0; overflow-y: auto; white-space: pre-wrap; margin: 0 0 24px; color: #caba9f; font-size: 15px }
#viewQuest { margin-top: auto; clip-path: polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%); background: linear-gradient(90deg,#3b221a,#6a3026,#3b221a) }
#menu > #close { position: absolute; right: 5%; top: 8%; z-index: 3; clip-path: polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%); background: linear-gradient(90deg,#352019,#6b3328,#352019) }
#notice { position: absolute; left: 7%; right: 7%; bottom: 7%; padding: 8px; background: #1f1713; border: 1px solid #bd9153; color: #ffdaad; font: 13px 'Segoe UI', sans-serif; z-index: 10 }
#subpage { position: absolute; inset: 8% 5% 10%; background: rgba(14,17,18,.96); padding: 22px; display: flex; flex-direction: column; min-height: 0 }
.subHeader { display: flex; align-items: center; gap: 16px; margin-bottom: 18px }
.subHeader #close { position: static; margin-left: auto; flex: 0 0 auto }
h2 { font-size: clamp(24px, 2.5vw, 36px); margin: 0; font-weight: normal }
.subHeader .muted { margin-left: auto }
#attributesPage, #questsPage { min-height: 0; flex: 1; display: flex; flex-direction: column }
#attributeList { overflow-y: auto; flex: 1; min-height: 0 }
.allocation { display:flex; align-items:center; gap:7px; padding:0 0 10px; border-bottom:1px solid #4a3e2f; font:13px 'Segoe UI',sans-serif; color:#c0af98 }
.allocation button { min-width:38px; padding:4px 9px }
.allocation button[aria-pressed="true"] { background:#543025; border-color:#d3a15d; color:#fff0d4 }
.stat { display: grid; grid-template-columns: minmax(0, 1fr) 120px 110px; gap: 18px; padding: 18px 0; border-bottom: 1px solid #4a3e2f; align-items: center }
.stat h3 { font-weight: normal; margin: 0 0 5px; font-size: 23px; color: #ead2ad }
.stat p { margin: 4px 0; font: 13px/1.5 'Segoe UI', sans-serif; color: #c0af98; white-space: pre-wrap; overflow-wrap: anywhere }
.stat details { font: 12px/1.6 'Segoe UI', sans-serif; color: #bdad98 }
.stat summary { cursor: pointer; color: #d7b981 }
.stat .value { text-align: center; font-size: 30px }
.value small { display: block; font: 12px 'Segoe UI', sans-serif; color: #c1ad94 }
.adjust { display: flex; gap: 8px }
.adjust button { width: 42px; height: 40px; padding: 0; font: 22px 'Segoe UI', sans-serif }
.actions { display: flex; gap: 8px; align-items: center; padding-top: 18px; flex-wrap: wrap }
.actions .primary { background: #593021; border-color: #d3a15d }
.push { margin-left: auto }
#questTabs { display: flex; gap: 10px; margin-bottom: 12px }
#questsPage #questTabs button { color: #fff0d4; border-color: #704326; background: #3a231a }
#questsPage #questTabs button[aria-pressed="true"] { color: #fff5df; background: #6a3625; border-color: #d0a061 }
button[aria-pressed="true"] { background: #543025; border-color: #d3a15d }
#questsPage .muted, #questsPage .eyebrow { color: #654326 }
#questColumns { display: grid; grid-template-columns: 30% minmax(0, 1fr); gap: 18px; flex: 1; min-height: 0 }
#questList { overflow-y: auto; border-right: 1px solid #9b7448; padding: 5px 12px 5px 0 }
.questEntry { display: block; width: 100%; text-align: left; border: 1px solid transparent; border-bottom-color: #9d7950; padding: 11px 9px; background: transparent; color: #442b1d; overflow-wrap: anywhere }
.questEntry[aria-pressed="true"] { background: rgba(97,49,31,.16); border-color: #754426; color: #25160f; box-shadow: inset 3px 0 #834823 }
.questEntry small { display: block; font: 12px 'Segoe UI', sans-serif; color: #b9a28a; margin-top: 5px }
#questsPage .questEntry small { color: #684126 }
#questDetail { overflow-y: auto; min-width: 0; padding: 8px 14px; border: 1px solid rgba(93,54,31,.42); background: rgba(255,239,201,.22) }
#detailName { font-size: 28px; font-weight: normal; line-height: 1.3; margin: 16px 0; overflow-wrap: anywhere }
#detailDescription { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; line-height: 1.7 }

#confirm > div { max-width: 440px; padding: 30px; border: 1px solid #bd9153; background: #211b17 }

    #questTitle { margin: 7px 0 10px } #questSummary { font-size: 12px; margin-bottom: 10px }
    #available { margin-top: 8px; padding-top: 7px } #close { top: 7% }

}

#questsPage { position: relative; background: #111516; color: #eadbc1; padding: 18px 20px 14px; border: 1px solid #655b4b; box-shadow: inset 0 0 0 1px rgba(201,157,98,.16), 0 8px 18px #0006 }

#questsPage #questList { border-right: 1px solid #8f7047; padding: 4px 14px 4px 0 }
#questsPage .questEntry { position: relative; padding: 12px 12px 12px 46px; border: 0; border-bottom: 1px solid rgba(143,112,71,.54); background: transparent; color: #d8cbb7; clip-path: none }
#questsPage .questEntry::before { content: ""; position: absolute; left: 10px; top: 50%; width: 24px; height: 24px; transform: translateY(-50%); background-image: var(--discipline-art); background-size: 200% 200%; background-position: 100% 100%; background-repeat: no-repeat; opacity: .72 }

#questsPage #detailName { margin: 12px 0 18px; color: #eadbc1; font: 400 32px/1.25 Georgia,serif; overflow-wrap: anywhere }

#questsPage .actions { border-top: 1px solid #514a3f; margin-top: 12px; padding-top: 12px }

  <section id="questFeature"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cGF0aCBmaWxsPSIjZmZmIiBkPSJNNDkyLjQ3IDIxLjkzOGMtODIuNzQtLjI1Ni0xNjcuNDQyIDEyLjUtMjQyLjgxNCA0NS4wOTMgNS4yMDUgMTMuMTY2IDkuNTc4IDI4LjQ4IDEzLjE4OCA0NS41MzJDMjQyLjU1IDk3LjI3IDIxNy4xNjcgOTIuMzg1IDE5NC43MiA5NS41Yy00Ni4yMiAyOC40MzItODcuMTMgNjYuMzA1LTExOS40NCAxMTUuNTk0IDI1LjE5MyA3Ljc1NiA1MS41NyAyMi44MSA3Mi44NDUgNDMuODQ0LTMxLjg3LTcuMDQ1LTY4LjkwNy01Ljg5NS05OS4xODggMy0xMy43NDMgMjguNjg4LTI1LjAwOCA2MC40OC0zMy4zNDMgOTUuNjg3IDEyOC43MS0zMC42NjggMTMwLjUyMiAzLjUxNCA1MC43NSAxNDAuNDM4IDE2Ljg3NyAxMi42MTQgNDIuMTgyIDEzLjc3IDYxLjkwNi0xLjU2M0MxMzQgMjY3LjkzNiAyMzEuNDMgMzI2LjI0NiAyNTQuMTg4IDM1NC41NjJjMTQuMjg4LTQwLjU5IDM0Ljc3LTgyLjU0IDYyLjkwNi0xMjYuNDY4LTE3LjI5LTE0LjY2Ny0zOS4yMS0yNC44MzgtNjMuODEzLTMyLjM3NSAyNS4zNjQtNS4yNTYgNTAuOTEtMTAuOTI4IDc0LjEyNi0xMS4yMiA2LjQ4Mi0uMDgyIDEyLjc4LjI3MiAxOC44NDQgMS4xNTYgMTcuNTctMjQuMDA3IDM3LjQwOC00OC42MTIgNTkuNzUtNzMuOTctMTIuNTM4LTYuMzEtMjUuNDc2LTExLjQ1NC0zOC4xMjUtMTQuOTY3IDE3LjEzMi01Ljc2IDM1LjI3NC04LjM0IDUyLjg0NC04LjE1NyAyLjAxLjAyIDQuMDA0LjA5NSA2IC4xODcgMjAuMDctMjEuNzA4IDQxLjkyNy00My45NzYgNjUuNzUtNjYuODEzek00MjYuNzIgNDcuMjhjLTEzMC45MyA2NS4zOTQtMjI2LjYyNiAxNjIuOTI2LTI4MS43ODQgMjg2LjI1QzE3Mi4zNCAxODQuNDEgMjg3LjA0OCA4NC41NyA0MjYuNzIgNDcuMjh6Ii8+PC9zdmc+" alt=""><div class="eyebrow">Active quest</div><h2 id="questTitle">Loading...</h2><p id="questSummary"></p><button id="viewQuest" data-action="quests">View journal</button></section>
  <section id="subpage" hidden>
    <section id="settingsPage" hidden></section>
    <header class="subHeader"><button data-action="home">Character</button><h2 id="pageTitle"></h2><div id="pageMeta" class="muted"></div></header>
    <section id="attributesPage" hidden><div id="attributeList"></div><footer class="actions"><button data-action="reset">Reset</button><button data-action="sync">Sync</button><button id="undo" data-action="undo">Undo</button><button id="apply" data-action="apply" class="primary">Apply points</button><button class="push" data-action="previous" aria-label="Previous attributes">Previous</button><span id="statPage" class="muted"></span><button data-action="next" aria-label="Next attributes">Next</button></footer></section>
    <section id="questsPage" hidden><div class="journalBanner"><div class="eyebrow">CHRONICLES</div></div><div id="questTabs"><button data-action="active" id="activeTab">Active</button><button data-action="completed" id="completedTab">Completed</button></div><div id="questColumns"><div id="questList" aria-label="Quests"></div><article id="questDetail"><div class="detailHero"><div><div class="eyebrow" id="detailCategory"></div></div><span class="questScrollEmblem" aria-hidden="true"></span></div><h3 id="detailName"></h3><div class="questTracking"><span id="questState"></span><button id="trackQuest" hidden>Untrack</button></div><div id="detailObjectives"></div><div id="detailDescription"></div></article></div><footer class="actions"><span id="questPage" class="muted"></span><button class="push" data-action="previous" aria-label="Previous quests">Previous</button><button data-action="next" aria-label="Next quests">Next</button></footer></section>
  </section>
  <button id="settingsButton" data-action="settings">Settings</button>
  <button id="adminButton" data-action="admin" hidden>Admin</button>
  <button id="close" data-action="close">Close</button>
  <div id="notice" role="status" hidden></div>
  <div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden><div><h2 id="confirmTitle">Discard changes?</h2><p id="confirmText"></p><div class="actions"><button id="confirmNo">Keep editing</button><button id="confirmYes">Continue</button></div></div></div>
</main>
<script>
(function() {
    var bridge = window.cnpc
    if (!bridge) return
    var data = decode(bridge.initData || {})
    var session = data.session
    var selectedQuest = null
    var pendingAction = null
    var chunk = null
    var busy = false
    var timeout = null
    var returnFocus = null
    var allocationAmount = 1
    function byId(id) { return document.getElementById(id) }
    function decode(value) { for (var i=0; i<2 && typeof value === 'string'; i++) value=JSON.parse(value); return value || {} }
    function text(id, value) { byId(id).textContent = value === undefined ? '' : String(value) }
    function notice(value) { text('notice', value); byId('notice').hidden = !value }
    function send(action, key, amount) {
        if (busy && action !== 'close') return
        busy = true
        notice('')
        clearTimeout(timeout)
        timeout = setTimeout(function() { busy=false; notice('No response yet. Use Refresh to try again.'); byId('notice').appendChild(button('Refresh', function() { send('refresh') })) }, 8000)
        var payload={ action: action, key: key || '', session: session }
        if (amount !== undefined) payload.amount=amount
        bridge.sendEvent('player_menu', payload)
    }
    function button(label, handler) { var el=document.createElement('button'); el.type='button'; el.textContent=label; el.onclick=handler; return el }
    function el(tag, value, className) { var node=document.createElement(tag); if (value !== undefined) node.textContent=String(value); if(className) node.className=className; return node }
    function request(action, key) {
        if (action === 'reset' || (data.pending > 0 && ['home','quests','skills','map','settings','admin','close'].indexOf(action)>=0)) {
            pendingAction={action:action,key:key}
            text('confirmTitle', action === 'reset' ? 'Reset attributes?' : 'Discard changes?')
            text('confirmText', action === 'reset' ? 'This consumes '+data.resetItem+' from your main hand and returns allocated points.' : 'Your unspent changes will be discarded.')
            returnFocus=document.activeElement
            byId('menu').classList.add('confirming')
            byId('confirm').hidden=false
            byId('confirmNo').focus()
            return
        }
        send(action,key)
    }
    function renderStats() {
        var list=byId('attributeList'); list.textContent=''
        var allocation=el('div',undefined,'allocation'); allocation.appendChild(el('span','Allocate:'))
        ;[1,5,10,'all'].forEach(function(amount) { var label=amount==='all'?'All':String(amount), choice=button(label,function(){ allocationAmount=amount; renderStats() }); choice.setAttribute('aria-pressed',String(allocationAmount===amount)); choice.setAttribute('aria-label','Allocate '+label+' points at a time'); allocation.appendChild(choice) })
        list.appendChild(allocation)
        ;(data.stats || []).forEach(function(stat) {
            var row=el('section',undefined,'stat'), info=el('div'), value=el('div',stat.allocated+stat.base+stat.bonus+stat.pending,'value'), adjust=el('div',undefined,'adjust')
            info.appendChild(el('h3',stat.name)); info.appendChild(el('p',stat.description))
            var details=el('details'), summary=el('summary',stat.effectiveness+'% effectiveness'); details.appendChild(summary)
            details.appendChild(el('div','Allocated '+stat.allocated+' · Class '+stat.base+' · Skills '+stat.bonus))
            ;(stat.effects || []).forEach(function(effect) { details.appendChild(el('div',effect.name+': '+Number(effect.value).toFixed(3))) })
            info.appendChild(details); value.appendChild(el('small',stat.pending ? '+'+stat.pending+' pending' : 'total points'))
            var minus=button('−',function(){send('minus',stat.key,allocationAmount)}), plus=button('+',function(){send('plus',stat.key,allocationAmount)})
            minus.setAttribute('aria-label','Remove pending '+stat.name); plus.setAttribute('aria-label','Add '+stat.name)
            minus.disabled=stat.pending<=0; plus.disabled=data.points<=0; adjust.appendChild(minus); adjust.appendChild(plus)
            row.appendChild(info); row.appendChild(value); row.appendChild(adjust); list.appendChild(row)
        })
        byId('apply').disabled=byId('undo').disabled=!(data.pending>0)
        text('apply',data.pending>0 ? 'Apply '+data.pending+' point'+(data.pending===1?'':'s') : 'Apply points')
        text('statPage',(data.page+1)+' / '+data.pages)
    }
    function selectQuest(id) {
        var quests=data.quests || [], quest=null
        for(var i=0;i<quests.length;i++) if(quests[i].id===id) quest=quests[i]
        selectedQuest=quest ? quest.id : null
        text('detailCategory',quest ? quest.category+' · '+(data.mode==='COMPLETED'?'Completed':'In progress') : '')
        text('detailName',quest ? quest.name : 'No quests here yet')
        text('detailDescription',quest ? quest.description : 'Your adventures will appear in this journal.')
        var completed=data.mode==='COMPLETED'
        text('questState',!quest?'':completed?'Completed':quest.ready?'Ready to turn in':quest.tracked?'Tracked · Waypoints visible':'Not tracked · Waypoints hidden')
        var track=byId('trackQuest'); track.hidden=!quest||completed
        track.textContent=quest&&quest.tracked?'Untrack':'Track'
        track.setAttribute('aria-pressed',String(!!(quest&&quest.tracked)))
        var objectives=byId('detailObjectives'); objectives.textContent=''
        ;(quest&&quest.objectives||[]).forEach(function(objective){
            var row=el('div',undefined,'objective'+(objective.complete?' complete':'')), top=el('div',undefined,'objectiveTop')
            top.appendChild(el('span',objective.text||'Objective'))
            top.appendChild(el('strong',objective.progress+' / '+objective.maximum,'objectiveCount'))
            var bar=el('div',undefined,'objectiveTrack'), fill=el('div',undefined,'objectiveFill')
            fill.style.width=(objective.maximum>0?Math.max(0,Math.min(100,objective.progress/objective.maximum*100)):objective.complete?100:0)+'%'
            bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); objectives.appendChild(row)
        })
        var entries=byId('questList').querySelectorAll('button')
        for(var j=0;j<entries.length;j++) entries[j].setAttribute('aria-pressed',String(Number(entries[j].dataset.id)===selectedQuest))
    }
    function renderQuests() {
        var list=byId('questList'); list.textContent=''
        ;(data.quests || []).forEach(function(quest) {
            var entry=button(quest.name,function(){selectQuest(quest.id)}); entry.className='questEntry'; entry.dataset.id=quest.id
            entry.appendChild(el('small',quest.category)); list.appendChild(entry)
        })
        var match=(data.quests || []).some(function(q){return q.id===selectedQuest})
        selectQuest(match ? selectedQuest : data.quests && data.quests.length ? data.quests[0].id : null)
        byId('activeTab').setAttribute('aria-pressed',String(data.mode!=='COMPLETED'))
        byId('completedTab').setAttribute('aria-pressed',String(data.mode==='COMPLETED'))
        text('activeTab','Active ('+data.activeCount+')'); text('completedTab','Completed ('+data.completedCount+')')
        text('questPage',data.pages>1 ? (data.page+1)+' / '+data.pages : '')
    }
    function renderSettings() {
        var page=byId('settingsPage'); page.textContent=''
        page.appendChild(el('p','Choose which chat notifications you receive. Changes save automatically.','muted'))
        var options=[['levelUp','Level-up messages','Show a message when your character gains a level.'],['skills','Skills available','Notify when a new skill becomes learnable.'],['choices','Path choices available','Notify when a path choice becomes available.'],['upgrades','Upgrades available','Notify when a learned skill can be upgraded.'],['points','Unspent attribute points','Remind me every 5 minutes while I have points to spend.']]
        options.unshift(['exp','EXP gains','Show a chat message such as +25 EXP.'],['spirit','Spirit gains','Show a chat message such as +25 Spirit.'],['gold',(data.currency||{}).displayName||'Gold','Notify when you gain money.'])
        var grid=el('div',undefined,'notificationGrid');page.appendChild(grid)
        options.forEach(function(option){
            var row=el('div',undefined,'notificationSetting'),info=el('div'),enabled=(data.notifications||{})[option[0]]!==false
            info.appendChild(el('strong',option[1]));info.appendChild(el('p',option[2]))
            var toggle=button(enabled?'On':'Off',function(){send('notification',option[0],!enabled)})
            toggle.setAttribute('aria-label',option[1]);toggle.setAttribute('aria-pressed',String(enabled))
            row.appendChild(info);row.appendChild(toggle);grid.appendChild(row)
        })
    }
    function render(next) {
        if (next.session !== session) return
        data=next; busy=false; clearTimeout(timeout)
        text('playerName',data.name); text('className',data.className); text('points',data.points); text('level',data.level)
        var currency=data.currency||{},moneyName=currency.displayName||'Gold',spirit=Number(data.spiritBalance||data.spirit||0),money=Number(data.moneyBalance||data.money||0)
        text('spiritBalance',spirit+' Spirit'); text('moneyBalance',money+' '+moneyName)
        byId('xp').value=data.maxLevel ? 100 : Math.max(0,Math.min(100,data.exp/Math.max(1,data.expNeeded)*100))
        text('xpText',data.maxLevel ? 'Maximum level' : data.exp+' / '+data.expNeeded+' EXP')
        text('questTitle',data.featuredQuest ? data.featuredQuest.name : 'No active quests')
        text('questSummary',data.featuredQuest ? data.featuredQuest.description : 'Explore the world to find your next adventure.')
        var home=data.view==='home', close=byId('close'), header=byId('subpage').querySelector('.subHeader')
        ;['identity','navigation','portrait','progress','questFeature','settingsButton'].forEach(function(id){byId(id).hidden=!home})
        byId('adminButton').hidden=!home || data.creative!==true
        byId('subpage').hidden=home; byId('attributesPage').hidden=data.view!=='attributes'; byId('questsPage').hidden=data.view!=='quests'
        if (home) byId('menu').appendChild(close); else header.appendChild(close)
        byId('settingsPage').hidden=data.view!=='settings'
        text('pageTitle',data.view==='settings'?'Notifications':data.view==='attributes'?'Attributes':'Quest journal'); text('pageMeta',data.view==='settings'?'Saved for your character':data.view==='attributes'?data.points+' points available':data.activeCount+' active quests')
        if(data.view==='settings') renderSettings()
        if(data.view==='attributes') renderStats()
        if(data.view==='quests') renderQuests()
        var paging=byId('subpage').querySelectorAll('[data-action="previous"], [data-action="next"]')
        for(var i=0;i<paging.length;i++) { paging[i].disabled=paging[i].dataset.action==='previous' ? data.page<=0 : data.page>=data.pages-1; paging[i].hidden=data.view==='quests'&&data.pages<=1 }
        notice('')
    }
    document.querySelectorAll('[data-action]').forEach(function(node){node.onclick=function(){request(node.dataset.action)}})
    byId('trackQuest').onclick=function(){if(selectedQuest!==null)send('track',String(selectedQuest))}
    function closeConfirm() {
        pendingAction=null;byId('confirm').hidden=true;byId('menu').classList.remove('confirming')
        if(returnFocus&&returnFocus.isConnected) returnFocus.focus()
        returnFocus=null
    }
    byId('confirmNo').onclick=closeConfirm
    byId('confirmYes').onclick=function(){var action=pendingAction;closeConfirm();if(action)send(action.action,action.key)}
    document.addEventListener('keydown',function(event){
        if(byId('confirm').hidden||event.key!=='Tab') return
        event.preventDefault()
        var target=document.activeElement===byId('confirmNo')?byId('confirmYes'):byId('confirmNo')
        target.focus()
    })
    bridge.onEvent('player_menu_update',function(value){render(decode(value))})
    bridge.onEvent('player_menu_notice',function(value){busy=false;clearTimeout(timeout);notice(decode(value).message)})
    bridge.onEvent('player_menu_chunk',function(value){
        var p=decode(value)
        if(!Number.isInteger(p.total)||p.total<1||p.total>350||!Number.isInteger(p.index)||p.index<0||p.index>=p.total||typeof p.data!=='string'||p.data.length>3000) return
        if(!chunk||chunk.id!==p.batchId) chunk={id:p.batchId,total:p.total,parts:[],count:0}
        if(chunk.total!==p.total) return
        if(chunk.parts[p.index]===undefined){chunk.count++;chunk.parts[p.index]=p.data}
        if(chunk.count===chunk.total){var joined=chunk.parts.join('');chunk=null;if(joined.length<=1048576)render(decode(joined))}
    })
    send('ready')
})()
</script>

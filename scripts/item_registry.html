<main class="registry">
 <header class="head"><h1>Item Registry</h1><small>World catalogue and drop templates</small><button class="close" id="close">Close</button></header>
 <section class="workspace">
  <aside class="panel sidebar">
   <div class="switch"><button id="items">Items</button><button id="sets">Sets</button></div>
   <input class="search" id="search" placeholder="Search name, ID, category">
   <div class="entries" id="entries"></div>
   <div class="actions"><button class="primary" id="newEntry">New</button><button id="refresh">Refresh</button></div>
  </aside>
  <section class="panel main"><nav class="tabs" id="tabs"></nav><div class="content" id="content"></div></section>
 </section>
 <footer class="foot"><span class="status" id="status"></span><span id="templateState" class="note"></span><div class="actions"><button id="archive" class="danger">Archive</button><button id="save" class="primary">Save</button></div></footer>
</main>
<div class="picker" id="statPicker"><div class="picker-card"><div class="picker-head"><h2>Choose stat</h2><button id="closePicker">Close</button></div><input class="search" id="statSearch" placeholder="Search name, ID, or mod"><div class="picker-list" id="statList"></div></div></div>
<script>
var state=window.cnpc.initData||{},tab=state.tab||'Template',query='',honeLevel=state.honeLevel||1,statTarget=null,dirty=false,editingDefaults=false,itemAnchors={}
var rarities=['Common','Uncommon','Rare','Epic','Legendary','Quest']
function el(id){return document.getElementById(id)}
function esc(v){return String(v===undefined||v===null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function plain(v){return String(v||'').replace(/§[0-9a-fk-or]/gi,'').replace(/&[0-9a-fk-or]/gi,'')}
function send(action,extra){var out=extra||{};out.action=action;out.tab=tab;out.honeLevel=honeLevel;window.cnpc.sendEvent('item_registry',out)}
function navigate(action,extra){if(dirty&&window.confirm&&!window.confirm('Discard unsaved item changes?'))return;dirty=false;send(action,extra)}
function setField(name,value){if(!state.draft)return;state.draft[name]=value}
function bindFields(){Array.prototype.forEach.call(document.querySelectorAll('[data-field]'),function(node){node.oninput=function(){setField(node.dataset.field,node.type==='checkbox'?node.checked:node.value)}})}
function field(label,name,value,type,full){if(type==='textarea')return'<div class="field '+(full?'full':'')+'"><label>'+esc(label)+'</label><textarea data-field="'+name+'">'+esc(value)+'</textarea></div>';return'<div class="field '+(full?'full':'')+'"><label>'+esc(label)+'</label><input data-field="'+name+'" type="'+esc(type||'text')+'" value="'+esc(value)+'" '+(name==='id'?'readonly':'')+'></div>'}
function selectField(label,name,value,values){return '<div class="field"><label>'+esc(label)+'</label><select data-field="'+name+'">'+values.map(function(v){return'<option value="'+esc(v)+'" '+(String(v)===String(value)?'selected':'')+'>'+esc(v||'None')+'</option>'}).join('')+'</select></div>'}
function toggle(label,name,value){return'<label class="toggle"><input type="checkbox" data-field="'+name+'" '+(value?'checked':'')+'> '+esc(label)+'</label>'}

function renderLore(d){if(editingDefaults){var f=state.loreDefaults||{};return '<div class="grid">'+[['lore','Default identified lore'],['statHeader','Stats heading'],['statLine','Stat line'],['honeStat','Hone stat addition'],['honeName','Honed name suffix']].map(function(x){return '<div class="field '+(x[0]==='lore'?'full':'')+'"><label>'+x[1]+'</label>'+(x[0]==='lore'?'<textarea data-format="'+x[0]+'">'+esc(f[x[0]]||'')+'</textarea>':'<input data-format="'+x[0]+'" value="'+esc(f[x[0]]||'')+'">')+'</div>'}).join('')+'<p class="note full">Lore layout applies to newly registered items. Stat and hone formats apply to all registry items. Stat tokens: {icon} {value_color} {value} {name_color} {name} {hone} {range}. Hone tokens: {value} or {level}. &amp; colors supported.</p><button id="saveDefaults" class="primary">Save world defaults</button><button id="cancelDefaults">Back</button></div>'}return '<div class="actions"><button id="editDefaults">Edit world defaults</button><button id="useDefaults">Use default lore</button></div>'+'<div class="grid">'+field('Identified lore layout','lore',d.lore||'','textarea',true)+field('Unidentified lore layout','unknownLore',d.unknownLore||'','textarea',true)+toggle('Show rolled min–max ranges','showRanges',d.showRanges!==false)+'<p class="note">Tokens: {rarity}, {item_type}, {description}, {rolled_stats}, {hone_bonuses}, {requirements}, {set_name}, {set_bonuses}. & color codes supported.</p></div>'}
function renderEquipment(d){var setValues=[''].concat((state.sets||[]).map(function(x){return x.id}));return'<div class="grid">'+selectField('Armor set','setId',d.setId||'',setValues)+'<div class="field"><label>Requirements</label><button id="requirements">Save and edit requirements</button></div><div class="policy-box full"><h3>How equipment stats activate</h3><p class="note">This template uses <strong>'+esc(d.slot||'none')+'</strong>. Mainhand, offhand, and every armor slot work. The item must be equipped in its matching slot; None is for materials and ordinary items and grants no equipment stats.</p></div></div>'}
function renderGive(d){return'<div class="grid"><div class="field"><label>Testing copy</label><button class="cyan" id="giveIdentified">Give identified item</button></div><div class="field"><label>Native drop copy</label><button class="primary" id="giveDrop">Give unidentified drop template</button></div><p class="note full">Drop copies are ordinary paper until an Identifier rolls them. Giving always uses the saved revision, never unsaved changes.</p></div>'}
function renderEditor(){hideItemIcons();renderTabs();var d=state.draft;if(!d){el('content').innerHTML='<div class="empty"><div><h2>Select an entry</h2><p>Search the catalogue or create a new '+(state.kind==='sets'?'set':'item')+'.</p></div></div>';el('save').disabled=true;el('archive').disabled=true;return}el('save').disabled=false;el('archive').disabled=state.kind==='sets';el('archive').textContent=d.archived?'Restore':'Archive';var html=tab==='Template'?renderTemplate(d):tab==='Stats'?renderStats(d):tab==='Honing'?renderHoning(d):tab==='Reroll'?renderReroll(d):tab==='Lore'?renderLore(d):tab==='Equipment'?renderEquipment(d):renderGive(d);el('content').innerHTML=html;bindFields();Array.prototype.forEach.call(document.querySelectorAll('[data-rarity]'),function(n){n.oninput=function(){d.rarityWeights=d.rarityWeights||{};d.rarityWeights[n.dataset.rarity]=n.value}});if(tab==='Stats')bindBonuses();if(tab==='Honing')bindHoning();if(tab==='Reroll')bindReroll();if(el('editDefaults'))el('editDefaults').onclick=function(){editingDefaults=true;renderEditor()};if(el('cancelDefaults'))el('cancelDefaults').onclick=function(){editingDefaults=false;renderEditor()};if(el('useDefaults'))el('useDefaults').onclick=function(){d.lore=state.loreDefaults.lore;dirty=true;renderEditor()};if(el('saveDefaults'))el('saveDefaults').onclick=function(){var formats={};document.querySelectorAll('[data-format]').forEach(function(n){formats[n.dataset.format]=n.value});editingDefaults=false;send('save_defaults',{formats:formats,draft:d})};requestAnimationFrame(syncItemIcons);if(el('capture'))el('capture').onclick=function(){send('capture',{draft:d})};if(el('requirements'))el('requirements').onclick=function(){send('requirements',{draft:d})};if(el('giveIdentified'))el('giveIdentified').onclick=function(){send('give',{mode:'identified',draft:d})};if(el('giveDrop'))el('giveDrop').onclick=function(){send('give',{mode:'drop',draft:d})}}
function render(){renderList();renderEditor();el('status').textContent=state.error||state.message||'Changes stay in the draft until saved.';el('status').className='status '+(state.error?'error':state.message?'ok':'');el('templateState').textContent=state.kind==='items'?(state.hasTemplate?'Base item captured':'No base item captured'):'';el('newEntry').textContent=state.kind==='sets'?'New set':'Register held'}
el('content').oninput=function(){dirty=true};el('content').onclick=function(){dirty=true};el('search').oninput=function(){query=this.value;renderList()};el('items').onclick=function(){navigate('switch_kind',{kind:'items'})};el('sets').onclick=function(){navigate('switch_kind',{kind:'sets'})};el('newEntry').onclick=function(){navigate('new')};el('refresh').onclick=function(){navigate('ready')};el('save').onclick=function(){send('save',{draft:state.draft})};el('archive').onclick=function(){send('archive',{draft:state.draft})};el('close').onclick=function(){navigate('close')}
if(el('closePicker'))el('closePicker').onclick=function(){el('statPicker').className='picker';syncItemIcons()};if(el('statSearch'))el('statSearch').oninput=renderStatPicker
window.cnpc.onEvent('item_registry_update',function(data){for(var i=0;i<2&&typeof data==='string';i++)data=JSON.parse(data);state=data||{};if(!state.error)dirty=false;render()})
render();send('ready')
</script></body></html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identify Item</title>
<style>
:root{--ink:#eadbc1;--muted:#a89982;--gold:#d5a354;--gold2:#ffe09a;--cyan:#54d7df;--line:#80643d;--panel:rgba(8,15,17,.82);--danger:#ff998c;--ok:#8ee6ae}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{display:grid;place-items:center;background:transparent;color:var(--ink);font:14px/1.35 Georgia,'Times New Roman',serif}
button{font:inherit;color:var(--ink);cursor:pointer}
button:disabled{opacity:.38;cursor:default}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.identifier{position:relative;width:min(1120px,96vw);height:min(630px,94vh);padding:42px 48px 38px;background:#071013 var(--identify-art) center/100% 100% no-repeat;filter:drop-shadow(0 20px 35px #000b);display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;overflow:hidden}
.header{display:flex;align-items:center;gap:18px;padding:5px 12px 10px;border-bottom:1px solid #3c777a}
.sigil{width:42px;height:42px;border:1px solid var(--cyan);transform:rotate(45deg);background:radial-gradient(circle,#46dce6 0 12%,#15363b 14% 45%,#071012 47%);box-shadow:0 0 20px #2ad9e655}
.title{flex:1;min-width:0}.eyebrow{margin:0;color:var(--cyan);font:700 10px/1 Arial,sans-serif;letter-spacing:2.4px}.title h1{margin:3px 0 0;color:var(--gold2);font-size:27px;text-shadow:0 2px #000}
.close,.identifyButton{border:1px solid #9b7441;background:linear-gradient(#57341f,#281b17);padding:9px 18px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.hint{margin:0 14px;color:var(--muted);font-size:13px}
.content{min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:14px;padding:0 12px}
.pane{min-height:0;border:1px solid #506164;background:linear-gradient(140deg,rgba(13,26,28,.9),rgba(5,10,12,.82));box-shadow:inset 0 0 28px #0009;padding:13px}
.pane h2{margin:0 0 10px;color:var(--gold2);font-size:16px}
.hotbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.itemTile{min-width:0;height:73px;display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:8px;text-align:left;border:1px solid #48575a;background:rgba(13,22,24,.88);padding:6px}
.itemTile:hover,.itemTile.selected{border-color:var(--gold);background:linear-gradient(100deg,#57301fbb,#152426)}
.itemTile.selected{box-shadow:inset 3px 0 var(--cyan),0 0 10px #22dbe233}
.rune{width:40px;height:40px;display:grid;place-items:center;border:1px solid #8b693d;background:radial-gradient(circle,#603b24,#171717 68%)}
.itemTile strong,.itemTile small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.itemTile small{color:var(--muted);font:11px Arial,sans-serif;margin-top:3px}
.empty{grid-column:1/-1;display:grid;place-items:center;min-height:180px;color:var(--muted);border:1px dashed #46575a}
.preview{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px}
.previewItem{display:grid;place-items:center;align-content:center;gap:12px;text-align:center;background:radial-gradient(circle at 50% 45%,#15414877,transparent 58%)}
.previewRune{width:92px;height:92px;display:grid;place-items:center;border:2px solid var(--cyan);transform:rotate(45deg);background:#071012aa;box-shadow:0 0 28px #2edce844}.previewRune span{transform:rotate(-45deg);color:var(--gold2);font-size:45px}
.previewName{color:var(--gold2);font-size:19px;font-weight:700}.previewMeta{color:var(--muted);font:12px Arial,sans-serif}
.cost{border-top:1px solid #435659;padding-top:9px}.cost strong{color:var(--gold2)}.cost small{display:block;color:var(--muted);font:11px Arial,sans-serif;margin-top:3px}
.footer{display:flex;align-items:center;gap:12px;padding:0 12px 3px}.status{flex:1;min-width:0;color:var(--muted);font:12px Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status.error{color:var(--danger)}.status.ok{color:var(--ok)}
.identifyButton{min-width:260px;background:linear-gradient(#41652f,#1e361a);border-color:#90ca6c;color:#ffe8a9;font-weight:700;font-size:16px}
@media(max-width:760px){.identifier{width:100vw;height:100vh;padding:34px 32px 28px}.content{grid-template-columns:1fr .8fr}.hotbar{grid-template-columns:repeat(2,minmax(0,1fr))}.itemTile{height:62px}.hint{display:none}}
@media(max-height:560px){.identifier{padding:28px 34px 24px;gap:7px}.header{padding-bottom:6px}.sigil{width:32px;height:32px}.title h1{font-size:21px}.itemTile{height:54px}.previewRune{width:66px;height:66px}.previewRune span{font-size:32px}}
</style>
</head>
<body>
<main class="identifier" aria-labelledby="title">
  <header class="header"><div class="sigil" aria-hidden="true"></div><div class="title"><p class="eyebrow">ARCANE IDENTIFICATION</p><h1 id="title">Identify Item</h1></div><button id="close" class="close" type="button">Close</button></header>
  <p class="hint">Choose one unidentified registered item from your hotbar.</p>
  <section class="content">
    <div class="pane"><h2>Unidentified items</h2><div id="hotbar" class="hotbar" role="list"></div></div>
    <aside class="pane preview"><h2>Selected item</h2><div id="preview" class="previewItem"></div><div id="cost" class="cost"></div></aside>
  </section>
  <footer class="footer"><div id="status" class="status" role="status" aria-live="polite"></div><button id="identify" class="identifyButton" type="button">Identify selected item</button></footer>
</main>
<script>
(function(){
    var bridge=window.cnpc
    if(!bridge)return
    var data=decode(bridge.initData||{})
    var busy=false
    function decode(value){if(typeof value==='string'){try{return JSON.parse(value)}catch(error){return {}}}return value&&typeof value==='object'?value:{}}
    function text(node,value){node.textContent=value===undefined||value===null?'':String(value)}
    function byId(id){return document.getElementById(id)}
    function send(action,extra){if(busy&&action!=='close')return;busy=action!=='close';var payload={action:action};extra=extra||{};Object.keys(extra).forEach(function(key){payload[key]=extra[key]});bridge.sendEvent('item_identify',payload)}
    function render(){
        var items=Array.isArray(data.items)?data.items:[]
        var selected=data.selected||null
        var list=byId('hotbar');list.innerHTML=''
        if(!items.length){var empty=document.createElement('div');empty.className='empty';text(empty,'No unidentified items are in your hotbar.');list.appendChild(empty)}
        items.forEach(function(item){
            var button=document.createElement('button');button.type='button';button.className='itemTile'+(selected&&Number(selected.slot)===Number(item.slot)?' selected':'');button.setAttribute('role','listitem')
            var rune=document.createElement('span');rune.className='rune';rune.setAttribute('data-mc-slot',Number(item.overlaySlot))
            var copy=document.createElement('span'),name=document.createElement('strong'),slot=document.createElement('small');text(name,item.name||'Unidentified item');text(slot,'Hotbar slot '+(Number(item.slot)+1));copy.appendChild(name);copy.appendChild(slot);button.appendChild(rune);button.appendChild(copy)
            button.onclick=function(){send('select',{slot:Number(item.slot)})};list.appendChild(button)
        })
        var preview=byId('preview');preview.innerHTML=''
        var runeBox=document.createElement('div');runeBox.className='previewRune';if(selected){var rendered=document.createElement('span');rendered.setAttribute('data-mc-slot',Number(selected.overlaySlot));rendered.setAttribute('data-mc-scale','2');runeBox.appendChild(rendered)}else{var mark=document.createElement('span');text(mark,'?');runeBox.appendChild(mark)}preview.appendChild(runeBox)
        var name=document.createElement('div');name.className='previewName';text(name,selected?(selected.name||'Unidentified item'):'Nothing selected');preview.appendChild(name)
        var meta=document.createElement('div');meta.className='previewMeta';text(meta,selected?'Hotbar slot '+(Number(selected.slot)+1)+' · Rarity and stats hidden':'Select an item to reveal its properties.');preview.appendChild(meta)
        var fee=data.fee||{},costs=[];if(fee.spirit)costs.push(Number(fee.spirit)+' Spirit');if(fee.money)costs.push(Number(fee.money)+' Gold');if(fee.name)costs.push(escapeHtml(fee.name)+' ×'+Number(fee.count||1));byId('cost').innerHTML='<strong>'+(costs.length?costs.join(' + '):'Identification is free')+'</strong><small>'+(costs.length?'All listed costs are required. Items use your hotbar.':'No material cost.')+'</small>'
        var status=data.error||data.message||'';text(byId('status'),status);byId('status').className='status '+(data.error?'error':data.message?'ok':'')
        byId('identify').disabled=!selected||busy
    }
    function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    byId('close').onclick=function(){send('close')}
    byId('identify').onclick=function(){send('identify')}
    bridge.onEvent('item_identify_update',function(raw){data=decode(raw);busy=false;render()})
    render()
    send('ready')
})()
</script>

<style>
*{box-sizing:border-box}body{margin:0;background:rgba(7,10,14,.94);color:#eef2f4;font:14px system-ui,sans-serif}main{height:100vh;display:flex;flex-direction:column;padding:16px;gap:14px}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #dba834;padding-bottom:12px}h1{color:#57def0;font-size:20px;margin:0 auto 0 0}button,select{font:inherit;background:#242a31;color:inherit;border:1px solid #626d79;padding:8px 12px}button:hover,button:focus-visible{border-color:#57def0}select{max-width:40vw}#content{overflow:auto;flex:1}h2{font-size:16px;color:#f5c547;margin:22px 0 10px}table{width:100%;border-collapse:collapse;margin-bottom:18px}td,th{text-align:left;padding:9px;border-bottom:1px solid #353d46}th{color:#a4b1c1;font-size:12px}td{font-variant-numeric:tabular-nums}pre{white-space:pre-wrap;line-height:1.7;background:#171c22;padding:14px}#status{color:#a4b1c1;min-height:20px}.table{overflow-x:auto}.warning{color:#ffb365}#identity{color:#a4b1c1}@media(max-width:640px){main{padding:8px}h1{font-size:16px}td,th{padding:6px}button,select{padding:6px}}
</style>
<style data-rpg-bundle>/* Shared visual layer. Existing editor geometry and event bindings stay intact. */
:root { --rpg-ink: #111617; --rpg-surface: #1b1c1b; --rpg-gold: #be9560; --rpg-paper: #ecdbc0; --rpg-muted: #b5a58e; --rpg-red: #65342e }
body { color: var(--rpg-paper); font-family: 'Segoe UI', Arial, sans-serif }
button, input, select, textarea { font-family: inherit }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #e1b77a; outline-offset: 2px }
button { transition: border-color .12s, color .12s, background-color .12s }
#shell, main { border-color: #987345 !important; background: #111617 !important; box-shadow: 0 0 0 3px #2b241d, 0 18px 60px #0009 !important }
#header, header, #editorHeader { background: #201c19 !important; border-color: #987345 !important }
#title, h1, #editorHeading { color: #eed7af !important; font-family: Georgia, serif !important; letter-spacing: .05em !important; font-weight: normal !important }
#title { font-size: 23px !important }

.port { width: 8px !important; height: 8px !important; border-width: 1px !important; background: #bf985b !important }
.tier-line { background: #ba925127 !important }
.tier-label { border: 0 !important; border-bottom: 1px solid #a48553 !important; color: #e0c092 !important; background: #171c1de6 !important }
.eyebrow, .loadoutPaneHeader, .libraryGroup, .slotGroup, h2, h3 { color: #d8b277 !important }
#detailTitle, #detail h3 { font-family: Georgia, serif !important; font-weight: normal !important; color: #f1dcba !important }
.nodeDescription, #state, .itemCostDetails { font-size: 14px !important; line-height: 1.6 !important; color: #d3c1a7 }
.detail-box { background: transparent !important; border: 0 !important; border-bottom: 1px solid #66503a !important }
.detail-label { color: #b6a188 !important }
.detail-value { color: #edd5ac !important }
.flag { background: #151b1a !important; border-color: #756143; color: #c5b292 }
.flag.learned { color: #a1d1b2 !important; border-color: #5d866c !important }
.chip { border-color: #67583f !important; background: #202922 !important; color: #d6c6a7 !important }
.chip.red { color: #f0ac9b !important; background: #37211d !important }
.loadoutPane { background: #141a19ed !important; border-color: #715637 !important }
.slotCard, .libraryItem { background: #1c211e !important; border-color: #69593f !important }
.slotCard.selected, .slotCard.dragover, .slotCard.dropTarget { border-color: #e4ba79 !important; background: #3e3023 !important }

.sectionTitle, #visibilityHeading, #catalogList optgroup { color: #d8b277 !important }
#editorFooter { background: #191c1c !important; border-color: #65503b !important }
nav button[aria-selected=true], .markerRow.selected { color: #edcf9f !important; border-color: #be9560 !important; background: #3d3024 !important }
.cyan, .markerIcon.always, .preview-results strong { color: #d8b277 !important; border-color: #987345 !important }
input[type=checkbox] { accent-color: #be9560 }
button:hover:not(:disabled) { border-color: #d8b277 !important; color: #fff0d6 !important }
input:not([type='checkbox']), select, textarea { background: #111715 !important; border-color: #766247 !important; color: #ecd9bc !important }
.hint, .sub, label, .field label { color: #bba78c }
::-webkit-scrollbar { width: 8px; height: 8px }

body.self-skill-tree .epicSlots .slotCard.selected { border-color: #e3b56c !important; box-shadow: inset 0 0 0 1px #e3b56c, 0 2px 8px #0008 !important }
body.self-skill-tree .epicSlots .slotNumber { color: #d6a95e; font-size: 9px }
body.self-skill-tree .epicSlots .slotName { margin-top: 4px; font-family: Georgia, serif; font-size: 11px }
body.self-skill-tree .epicSlots .slotActual { display: none }
body.self-skill-tree #loadoutActions { gap: 6px; padding: 8px 10px; background: #1b1713 !important }
body.self-skill-tree #loadoutActions .tool { min-width: 82px; height: 28px; font-size: 10px }
body.self-skill-tree #loadoutSelection { font-size: 10px }
@media (max-width: 760px), (max-height: 560px) {
  body.self-skill-tree #loadoutWorkspace { padding: 7px }
  body.self-skill-tree #loadoutPanel { grid-template-columns: minmax(170px, 28%) minmax(0,72%); gap: 6px }
  body.self-skill-tree #loadoutSlots.epicSlots { grid-template-columns: repeat(auto-fit, minmax(92px,1fr)); gap: 5px; padding: 6px }
  body.self-skill-tree .epicSlots .slotCard { min-height: 53px; padding: 5px }
  body.self-skill-tree #loadoutFilters input, body.self-skill-tree #loadoutFilters select { padding: 4px; font-size: 10px }
}

/* Keep the player tree's JS geometry (198×92 and 99px edge anchors) intact. */
body.self-skill-tree .node { width: 198px !important; height: 92px !important; padding: 10px 11px 8px 66px !important; border: 1px solid #725b3d !important; background: rgba(20,25,23,.88) !important; box-shadow: inset 0 0 0 1px #17120e, 0 4px 10px #0009 !important; text-align: left }
body.self-skill-tree .node:before { left: 9px; top: 15px; width: 46px; height: 46px; background-size: cover; transform: none }
body.self-skill-tree .node-icon { left: 18px !important; top: 27px !important; width: 28px !important; height: 28px !important }
body.self-skill-tree .node-title { overflow: hidden !important; white-space: nowrap !important; text-overflow: ellipsis !important; line-height: normal }
body.self-skill-tree .node-meta { max-height: none; overflow: visible }
body.self-skill-tree .node-flags { position: static; transform: none; max-width: none; margin-top: 6px; justify-content: flex-start }
body.self-skill-tree #viewport { background: #17201e var(--rpg-art) center / cover no-repeat !important; background-blend-mode: multiply }
body.self-skill-tree #header, body.self-skill-tree .loadoutPaneHeader { background-size: cover !important }
body.self-skill-tree #toolbar .tool { background-size: cover !important }

/* Keep the tree as an engraved route, not a dashboard of cards. */
body.self-skill-tree .node { border-color: transparent !important; background: transparent !important; box-shadow: none !important }
body.self-skill-tree .node-title, body.self-skill-tree .node-meta, body.self-skill-tree .node-flags { display: table; padding: 1px 4px; background: rgba(13,17,15,.74); text-shadow: 0 1px 2px #000 }
body.self-skill-tree .node-title { max-width: 122px; margin-top: 2px; border-bottom: 1px solid rgba(183,140,76,.48) }
body.self-skill-tree .node-meta { max-width: 122px; margin-top: 1px }

body.self-skill-tree .hubPanel h2 { margin: 5px 0 7px; color: #f1d6a5; font: normal 30px Georgia,serif; text-shadow: 0 2px #25140d }
body.self-skill-tree .hubPanel p { margin: 0 auto 25px; max-width: 480px; color: #d2bea0; font-size: 13px }
body.self-skill-tree .hubChoices { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 17px }
body.self-skill-tree .hubChoice { position: relative; display: flex; min-height: 188px; align-items: center; flex-direction: column; justify-content: center; gap: 8px; padding: 15px 10px; border: 0; background: transparent; color: #eed6a8; cursor: pointer }
body.self-skill-tree .hubChoice:hover:not(:disabled) .hubMedallion, body.self-skill-tree .hubChoice:focus-visible .hubMedallion { border-color: #f0c36d; box-shadow: inset 0 0 0 4px #21160f,0 0 0 4px rgba(213,162,85,.2),0 5px 13px #0009 }
body.self-skill-tree .hubChoice:disabled { cursor: not-allowed; filter: grayscale(.7); opacity: .55 }
body.self-skill-tree .hubChoice strong { font: normal 16px Georgia,serif; text-shadow: 0 1px 2px #000 }
body.self-skill-tree .hubChoice small { color: #bca98a; font-size: 10px; line-height: 1.3 }

<body><main>
<header><h1>Player inspector</h1><select id="players" aria-label="Player"></select><button id="refresh">Refresh</button><button id="back">Back</button><button id="close">Close</button></header>
<div id="content"><div id="identity"></div><h2>Attribute points and effectiveness</h2><div class="table"><table><thead><tr><th>Stat</th><th>Class points</th><th>Allocated</th><th>Node points</th><th>Class %</th><th>Effective %</th><th>Source</th></tr></thead><tbody id="stats"></tbody></table></div><h2>Applied attributes</h2><div class="table"><table><thead><tr><th>Attribute</th><th>Calculated base</th><th>Actual base</th><th>Final with modifiers</th></tr></thead><tbody id="effects"></tbody></table></div><h2>Skill bindings</h2><pre id="bindings"></pre></div>
<div id="status" role="status"></div>
</main><script>
(function() {
    var $ = function(id) { return document.getElementById(id) }
    function number(value) { return value === null || value === undefined ? 'Unavailable' : String(Math.round(Number(value) * 10000) / 10000) }
    function row(parent, values, warning) {
        var tr = document.createElement('tr')
        if (warning) tr.className = 'warning'
        values.forEach(function(value) {
            var td = document.createElement('td')
            td.textContent = String(value)
            tr.appendChild(td)
        })
        parent.appendChild(tr)
    }
    function ensureWalletPanel() {
        if ($('walletPanel')) return
        var content = $('content'), panel = document.createElement('section'), heading = document.createElement('h2')
        panel.id = 'walletPanel'; heading.textContent = 'Wallets'; panel.appendChild(heading)
        var balance = document.createElement('div'); balance.id = 'walletBalance'; panel.appendChild(balance)
        var controls = document.createElement('div'); controls.className = 'walletControls'
        controls.innerHTML = '<select id="walletResource" aria-label="Wallet resource"><option value="Spirit">Spirit</option><option value="money">Normal money</option></select><select id="walletOperation" aria-label="Wallet operation"><option value="add">Add</option><option value="subtract">Subtract</option><option value="set">Set</option></select><input id="walletAmount" type="number" min="0" step="1" value="0" aria-label="Whole amount"><button id="walletApply">Apply</button>'
        panel.appendChild(controls); content.insertBefore(panel, content.firstChild)
        $('walletApply').onclick = function() {
            var amount = Number($('walletAmount').value)
            if (!isFinite(amount) || amount < 0 || Math.floor(amount) !== amount) { $('status').textContent = 'Wallet amount must be a whole number.'; return }
            send('wallet_' + $('walletOperation').value, $('walletResource').value, amount)
        }
    }
    function render(data) {
        if (typeof data === 'string') data = JSON.parse(data)
        if (typeof data === 'string') data = JSON.parse(data)
        data = data || {}
        ensureWalletPanel()
        var selection = data.target || $('players').value
        $('players').textContent = ''
        var players = data.players || []
        players.forEach(function(player) {
            var option = document.createElement('option')
            option.value = player.id
            option.textContent = player.name
            $('players').appendChild(option)
        })
        $('players').value = selection
        $('stats').textContent = ''
        $('effects').textContent = ''
        $('bindings').textContent = ''
        $('identity').textContent = ''
        $('status').textContent = data.ok ? 'Admin inspection · wallet edits are audited' : data.message || 'No data'
        if (!data.ok) return
        $('identity').textContent = data.name + ' · ' + data.className + ' · Level ' + data.level + ' · ' + data.target
        var wallet = data.wallet || {}, currency = data.currency || {}, spirit = Number(data.spiritBalance === undefined ? wallet.spiritBalance || wallet.spirit || 0 : data.spiritBalance), money = Number(data.moneyBalance === undefined ? wallet.moneyBalance || wallet.money || 0 : data.moneyBalance)
        $('walletBalance').textContent = 'Spirit ' + spirit + ' · ' + (currency.symbol || 'G') + ' ' + money + ' ' + (currency.displayName || 'Gold')
        var stats = data.stats || []
        stats.forEach(function(stat) {
            row($('stats'), [stat.name, number(stat.base), number(stat.allocated), number(stat.nodes), number(stat.classPercent) + '%', number(stat.effectivePercent) + '%', stat.source])
        })
        var effects = data.effects || []
        effects.forEach(function(effect) {
            row($('effects'), [effect.id, number(effect.expected), number(effect.base), number(effect.value)], effect.base !== null && Math.abs(effect.expected - effect.base) > .0001)
        })
        $('bindings').textContent = (data.lines || []).join('\n')
    }
    function send(action, resource, amount) {
        if (!window.cnpc) return
        var payload = { action: action, target: $('players').value }
        if (resource) payload.resource = resource
        if (amount !== undefined) payload.amount = amount
        window.cnpc.sendEvent('admin_inspect', payload)
        if (action !== 'back') $('status').textContent = 'Loading…'
    }
    $('players').onchange = function() { send('refresh') }
    $('refresh').onclick = function() { send('refresh') }
    $('back').onclick = function() { send('back') }
    $('close').onclick = function() { if (window.cnpc) window.cnpc.close() }
    if (window.cnpc) {
        window.cnpc.onEvent('inspection', render)
        render(window.cnpc.initData)
    }
})()
</script></body></html>
